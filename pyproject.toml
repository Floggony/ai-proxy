[project]
name = "ai-proxy"
version = "0.1.0"
description = "OpenAI-compatible proxy server with self-assessment routing"
authors = [
    {name = "Alexandr"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sse-starlette (>=3.4.8,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.2,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)"
]
